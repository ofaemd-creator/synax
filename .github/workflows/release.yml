name: SYNAX Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_label:
        description: "Manual version label when triggered via workflow_dispatch (e.g. v0.5.0-rc1)"
        required: false
        default: "v0.5.0-dev"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-python-dist:
    name: Build Python sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*.whl dist/*.tar.gz
          python scripts/build_vsix.py vsix_out
          cp vsix_out/*.vsix dist/

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-native-bundles:
    name: Build Native Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            shared_lib: libsynax_myelin.dylib
            cflags: "-O3 -mcpu=apple-m1 -shared -fPIC -std=c11"
          - target: linux-x86_64
            os: ubuntu-latest
            shared_lib: libsynax_myelin.so
            cflags: "-O3 -mavx2 -mfma -shared -fPIC -std=c11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Clang toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Compile & Verify Native Runtime
        shell: bash
        run: |
          rm -f libsynax_myelin.dylib libsynax_myelin.so
          clang ${{ matrix.cflags }} synax_myelin_engine.c -lm -ldl -o "${{ matrix.shared_lib }}"
          if [ "${{ matrix.shared_lib }}" = "libsynax_myelin.so" ]; then
            ln -sf libsynax_myelin.so libsynax_myelin.dylib
          fi
          python test_differential_myelin.py
          python test_unified_compiler.py

      - name: Assemble Standalone Archive
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_VER="${{ inputs.version_label }}"
          fi
          BUNDLE_NAME="synax-${RAW_VER}-${{ matrix.target }}"
          STAGE_DIR="release_stage"
          SHARE_DIR="${STAGE_DIR}/share/synax"
          mkdir -p "${STAGE_DIR}/bin" "${STAGE_DIR}/lib" "${STAGE_DIR}/include" "${SHARE_DIR}/examples" "${SHARE_DIR}/spec"

          cp "${{ matrix.shared_lib }}" "${STAGE_DIR}/lib/"
          cp "${{ matrix.shared_lib }}" "${SHARE_DIR}/libsynax_myelin.dylib"
          if [ "${{ matrix.shared_lib }}" = "libsynax_myelin.so" ]; then
            cp "${{ matrix.shared_lib }}" "${SHARE_DIR}/libsynax_myelin.so"
          fi
          cp include/synax.h include/synax.hpp "${STAGE_DIR}/include/"
          cp synax*.py synapse_brain.json "${SHARE_DIR}/"
          cp -R src "${SHARE_DIR}/"
          cp examples/*.sx examples/*.sx.lock "${SHARE_DIR}/examples/"
          cp spec/* "${SHARE_DIR}/spec/"
          cp LICENSE NOTICE LICENSING.md TRADEMARKS.md MEDICAL_RESEARCH_DISCLAIMER.md README.md "${SHARE_DIR}/"

          cat << 'WRAPPER' > "${STAGE_DIR}/bin/synax"
          #!/usr/bin/env sh
          SELF_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec python3 "${SELF_DIR}/../share/synax/synax_cli.py" "$@"
          WRAPPER
          chmod +x "${STAGE_DIR}/bin/synax"

          mkdir -p bundle_out
          tar -C "${STAGE_DIR}" -czf "bundle_out/${BUNDLE_NAME}.tar.gz" bin lib include share

      - name: Upload Native Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: bundle_out/*.tar.gz
          if-no-files-found: error

  create-github-release:
    name: Generate SHA256SUMS & GitHub Release
    needs:
      - build-python-dist
      - build-native-bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-sha256sums
          path: release_assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI (Optional)
    needs:
      - build-python-dist
      - build-native-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Python dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Upload to PyPI (when PYPI_API_TOKEN is configured)
        env:
          TWINE_USERNAME: __token__
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN secret is not configured; skipping PyPI upload."
            exit 0
          fi
          python -m pip install --upgrade pip twine
          TWINE_PASSWORD="${PYPI_API_TOKEN}" twine upload --non-interactive dist/*.whl dist/*.tar.gz
